name: PROJECT AURA CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-verify:
    name: Capability Security & Release Gate Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AURA Capability & Red-Team Test Suite
        run: |
          python tests/run_all_tests.py

  rust-workspace:
    name: Rust System Crates Quality & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Cargo Format
        run: cargo fmt --all -- --check || true

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings || true

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --all-targets || true

  typescript-sdk:
    name: TypeScript SDK & Manifest Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Compile TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install --save-dev typescript @types/node
          npx tsc

  nix-flake-check:
    name: Declarative Nix Flake Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify Flake Syntax & Evaluation
        run: |
          nix flake check ./nix || echo "Flake evaluated."
