name: Bug Report
description: Report a bug, defect, or unexpected behavior in PROJECT AURA
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug in PROJECT AURA!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Boot / launch AURA via '...'
        2. Run command '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Runtime
      description: OS version, hardware, deployment mode (Host simulator, WSL2, Native ISO).
    validations:
      required: true
